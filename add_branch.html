<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Branch - Sri Vishnu Priya Finance</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); min-height: 100vh; color: white; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .circle { position: fixed; border-radius: 50%; background: linear-gradient(135deg, #00d2ff, #3a7bd5); filter: blur(80px); z-index: 0; }
        .circle1 { width: 350px; height: 350px; top: -50px; left: -100px; opacity: 0.4; }
        .circle2 { width: 450px; height: 450px; bottom: -100px; right: -100px; opacity: 0.3; }

        .container { position: relative; z-index: 1; width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 30px; }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); }
        .header { display: flex; align-items: center; margin-bottom: 25px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 15px; }
        .back-btn { color: #00d2ff; font-size: 20px; text-decoration: none; margin-right: 15px; transition: 0.3s; }
        .back-btn:hover { transform: translateX(-5px); }
        .header h2 { font-size: 22px; font-weight: 600; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; align-items: end; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 13px; color: rgba(255,255,255,0.7); font-weight: 500; }
        .input-group input { width: 100%; padding: 12px 15px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; color: #fff; outline: none; font-size: 14px; }
        .input-group input:focus { border-color: #00d2ff; }

        .submit-btn { padding: 12px; background: linear-gradient(135deg, #00d2ff, #3a7bd5); border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; height: 45px; }
        .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3); }

        .table-container { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
        th, td { padding: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        th { font-size: 13px; color: rgba(255,255,255,0.7); text-transform: uppercase; background: rgba(255, 255, 255, 0.05); }
        td { font-size: 14px; }
        tbody tr:hover { background: rgba(255, 255, 255, 0.08); }

        .action-btns { display: flex; gap: 10px; }
        .btn-edit, .btn-delete { border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; transition: 0.3s; }
        .btn-edit { background: rgba(0, 210, 255, 0.2); color: #00d2ff; }
        .btn-edit:hover { background: #00d2ff; color: #fff; }
        .btn-delete { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; }
        .btn-delete:hover { background: #ff6b6b; color: #fff; }
    </style>
</head>
<body>
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>

    <div class="container">
        <!-- Add Branch Form -->
        <div class="glass-panel">
            <div class="header">
                <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h2>Add Branch</h2>
            </div>
            
            <form id="branchForm" class="form-grid">
                <input type="hidden" id="editId" value="">
                
                <div class="input-group">
                    <label>Branch Name</label>
                    <input type="text" id="branchName" placeholder="Enter Branch Name" required autocomplete="off">
                </div>

                <div class="input-group">
                    <label>Manager Name</label>
                    <input type="text" id="managerName" placeholder="Enter Manager Name" required autocomplete="off">
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Add Branch</button>
            </form>
        </div>

        <!-- Branches List Table -->
        <div class="glass-panel">
            <div class="header" style="border:none; margin-bottom:0;">
                <h2>Registered Branches</h2>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>S.No</th>
                            <th>Branch Name</th>
                            <th>Manager Name</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="branchTableBody">
                        <tr><td colspan="4" style="text-align:center; color:#00d2ff;">Loading Branches... <i class="fas fa-spinner fa-spin"></i></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvjFcKKiu4OMmQckYXMTejdBJh9tC6TjM",
            authDomain: "sri-vishnu-priya-finance-c591f.firebaseapp.com",
            databaseURL: "https://sri-vishnu-priya-finance-c591f-default-rtdb.firebaseio.com",
            projectId: "sri-vishnu-priya-finance-c591f",
            storageBucket: "sri-vishnu-priya-finance-c591f.firebasestorage.app",
            messagingSenderId: "184676228358",
            appId: "1:184676228358:web:c2b32b68debeeadadfd287"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Fetch Branches Real-time
        const branchesRef = ref(db, 'branches');
        onValue(branchesRef, (snapshot) => {
            const tableBody = document.getElementById('branchTableBody');
            tableBody.innerHTML = ''; 
            const data = snapshot.val();
            
            if (data) {
                let sno = 1;
                for (let key in data) {
                    let branch = data[key];
                    tableBody.innerHTML += `
                        <tr>
                            <td>${sno++}</td>
                            <td>${branch.branchName}</td>
                            <td>${branch.managerName}</td>
                            <td class="action-btns">
                                <button class="btn-edit" onclick="window.editBranch('${key}', '${branch.branchName}', '${branch.managerName}')"><i class="fas fa-edit"></i> Edit</button>
                                <button class="btn-delete" onclick="window.deleteBranch('${key}')"><i class="fas fa-trash-alt"></i> Delete</button>
                            </td>
                        </tr>
                    `;
                }
            } else {
                tableBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:rgba(255,255,255,0.5);">No branches found. Add a branch above.</td></tr>`;
            }
        });

        // Add or Update Branch
        document.getElementById("branchForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const editId = document.getElementById("editId").value;
            const branchName = document.getElementById("branchName").value.trim();
            const managerName = document.getElementById("managerName").value.trim();
            const submitBtn = document.getElementById("submitBtn");

            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

            if (editId) {
                update(ref(db, 'branches/' + editId), { branchName, managerName }).then(() => {
                    document.getElementById("editId").value = "";
                    submitBtn.innerText = "Add Branch";
                    submitBtn.style.background = "linear-gradient(135deg, #00d2ff, #3a7bd5)";
                    document.getElementById("branchForm").reset();
                });
            } else {
                push(ref(db, 'branches'), { branchName, managerName }).then(() => {
                    submitBtn.innerText = "Add Branch";
                    document.getElementById("branchForm").reset();
                });
            }
        });

        window.editBranch = function(key, branchName, managerName) {
            document.getElementById("editId").value = key; 
            document.getElementById("branchName").value = branchName;
            document.getElementById("managerName").value = managerName;
            const submitBtn = document.getElementById("submitBtn");
            submitBtn.innerText = "Update Branch";
            submitBtn.style.background = "linear-gradient(135deg, #f6d365, #fda085)"; 
            window.scrollTo({ top: 0, behavior: 'smooth' }); 
        };

        window.deleteBranch = function(key) {
            if(confirm("Are you sure you want to delete this branch?")) {
                remove(ref(db, 'branches/' + key));
            }
        };
    </script>
</body>
</html>
